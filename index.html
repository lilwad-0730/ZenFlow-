<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenFlow - 個人生產力中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.0/lucide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .progress-ring { transition: stroke-dashoffset 0.35s; transform: rotate(-90deg); transform-origin: 50% 50%; }
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        .timer-active { animation: pulse-soft 2s infinite ease-in-out; }
        .music-btn-active { @apply bg-indigo-100 text-indigo-700 border-indigo-300; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h1 class="text-3xl font-bold text-slate-800 tracking-tight">ZenFlow</h1>
                <p class="text-slate-500">掌握你的節奏，達成你的目標</p>
            </div>
            <div class="flex space-x-4">
                <button id="themeToggle" class="p-2 rounded-xl bg-white shadow-sm border border-slate-200 hover:bg-slate-50 transition-colors">
                    <i data-lucide="sun" class="w-5 h-5 text-slate-600"></i>
                </button>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <section class="lg:col-span-5 flex flex-col items-center">
                <div class="glass-effect rounded-3xl p-8 w-full shadow-xl border border-white flex flex-col items-center">
                    <div class="relative w-64 h-64 mb-8">
                        <svg class="w-full h-full">
                            <circle cx="128" cy="128" r="120" stroke="currentColor" stroke-width="8" fill="transparent" class="text-slate-100" />
                            <circle id="timerProgress" cx="128" cy="128" r="120" stroke="currentColor" stroke-width="8" fill="transparent" stroke-dasharray="753.98" stroke-dashoffset="0" class="text-indigo-500 progress-ring" />
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center">
                            <span id="timerDisplay" class="text-5xl font-light tracking-tighter">25:00</span>
                            <span id="timerStatus" class="text-xs uppercase tracking-widest text-slate-400 mt-2">專注時間</span>
                        </div>
                    </div>

                    <div class="flex space-x-4 mb-8">
                        <button id="startBtn" class="px-8 py-3 bg-indigo-600 text-white rounded-2xl font-semibold shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">
                            開始專注
                        </button>
                        <button id="resetBtn" class="p-3 bg-slate-100 text-slate-600 rounded-2xl hover:bg-slate-200 transition-all">
                            <i data-lucide="refresh-cw" class="w-6 h-6"></i>
                        </button>
                    </div>

                    <div class="grid grid-cols-3 gap-2 w-full">
                        <button onclick="setTimer(25, 'focus')" class="py-2 text-sm font-medium rounded-xl border border-slate-200 hover:border-indigo-300 transition-colors">專注</button>
                        <button onclick="setTimer(5, 'short')" class="py-2 text-sm font-medium rounded-xl border border-slate-200 hover:border-indigo-300 transition-colors">短休</button>
                        <button onclick="setTimer(15, 'long')" class="py-2 text-sm font-medium rounded-xl border border-slate-200 hover:border-indigo-300 transition-colors">長休</button>
                    </div>

                    <div class="mt-8 pt-8 border-t border-slate-100 w-full">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center">
                            <i data-lucide="music" class="w-4 h-4 mr-2"></i> 專注環境音
                        </h3>
                        <div class="space-y-3">
                            <div class="flex items-center justify-between p-3 rounded-2xl bg-slate-50 border border-slate-200 transition-all" id="noise-control">
                                <span class="text-sm font-medium text-slate-600">環境音效</span>
                                <div class="flex space-x-2">
                                    <button onclick="toggleAmbient('brown')" class="ambient-toggle p-2 rounded-lg border border-slate-200 hover:bg-white" title="深層白噪音"><i data-lucide="wind" class="w-4 h-4"></i></button>
                                    <button onclick="toggleAmbient('drone')" class="ambient-toggle p-2 rounded-lg border border-slate-200 hover:bg-white" title="冥想頻率"><i data-lucide="waves" class="w-4 h-4"></i></button>
                                    <button onclick="toggleAmbient('zen')" class="ambient-toggle p-2 rounded-lg border border-slate-200 hover:bg-white" title="禪意音浪"><i data-lucide="ocean" class="w-4 h-4"></i></button>
                                </div>
                            </div>
                            <input type="range" min="-40" max="0" value="-20" class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-indigo-500" oninput="updateVolume(this.value)">
                        </div>
                    </div>
                </div>
            </section>

            <section class="lg:col-span-7">
                <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-200 h-full">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-semibold flex items-center">
                            <i data-lucide="check-circle" class="w-5 h-5 mr-2 text-indigo-500"></i>
                            今日任務
                        </h2>
                        <span id="taskStats" class="text-xs font-medium px-2 py-1 bg-indigo-50 text-indigo-600 rounded-lg">0 / 0 完成</span>
                    </div>

                    <div class="flex mb-6">
                        <input id="taskInput" type="text" placeholder="接下來要做什麼？" class="flex-1 bg-slate-50 border-none rounded-l-2xl px-6 py-4 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <button id="addTaskBtn" class="bg-indigo-600 text-white px-6 rounded-r-2xl hover:bg-indigo-700 transition-colors">
                            <i data-lucide="plus" class="w-6 h-6"></i>
                        </button>
                    </div>

                    <ul id="taskList" class="space-y-3 max-h-[400px] overflow-y-auto pr-2">
                        <!-- 任務會動態渲染於此 -->
                    </ul>
                </div>
            </section>
        </main>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let timerId = null;
        let tasks = JSON.parse(localStorage.getItem('zenflow_tasks')) || [];
        
        let ambientSource = null;
        let currentAmbientType = null;
        const mainVolume = new Tone.Volume(-20).toDestination();

        // DOM 元素引用
        let timerDisplay, timerProgress, startBtn, resetBtn, taskInput, addTaskBtn, taskList, taskStats;

        function updateDisplay() {
            if (!timerDisplay || !timerProgress) return;
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            const timeString = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            timerDisplay.textContent = timeString;
            document.title = timerId ? `(${timeString}) ZenFlow` : 'ZenFlow - 個人生產力中心';
            
            const offset = 753.98 - (timeLeft / totalTime) * 753.98;
            timerProgress.style.strokeDashoffset = offset;
        }

        // 定義全域函數供 HTML 元素調用
        window.setTimer = function(mins, mode) {
            if (timerId) clearInterval(timerId);
            timerId = null;
            timeLeft = mins * 60;
            totalTime = mins * 60;
            
            if (startBtn) {
                startBtn.textContent = '開始專注';
                startBtn.className = "px-8 py-3 bg-indigo-600 text-white rounded-2xl font-semibold shadow-lg hover:bg-indigo-700 active:scale-95 transition-all";
            }
            
            const status = document.getElementById('timerStatus');
            if(status) status.textContent = mode === 'focus' ? '專注時間' : '休息時間';
            
            const timerContainer = document.querySelector('.relative.w-64');
            if(timerContainer) timerContainer.classList.remove('timer-active');
            
            updateDisplay();
        };

        window.toggleAmbient = async function(type) {
            await Tone.start();
            if (currentAmbientType === type) {
                stopAmbient();
                return;
            }
            
            stopAmbient();
            currentAmbientType = type;

            if (type === 'brown') {
                // 深層白噪音（風聲）
                ambientSource = new Tone.Noise("brown").start();
                const filter = new Tone.Filter(400, "lowpass").connect(mainVolume);
                ambientSource.connect(filter);
            } else if (type === 'drone') {
                // 冥想頻率
                ambientSource = new Tone.Oscillator(110, "sine").start();
                const lfo = new Tone.LFO(0.1, 100, 120).connect(ambientSource.frequency).start();
                ambientSource.connect(mainVolume);
            } else if (type === 'zen') {
                // 使用粉紅噪音作為基底，聽起來比白噪音柔和
                ambientSource = new Tone.Noise("pink").start();
                
                // 建立一個自動過濾器來模擬海浪的起伏
                const autoFilter = new Tone.AutoFilter({
                    frequency: 0.15, // 模擬每 6-7 秒一次的海浪
                    baseFrequency: 100,
                    octaves: 4,
                    filter: {
                        type: "lowpass"
                    }
                }).connect(mainVolume).start();
                
                ambientSource.connect(autoFilter);
            }
            
            updateAmbientUI();
        };

        window.stopAmbient = function() {
            if (ambientSource) {
                ambientSource.stop();
                // 確保所有連接的節點都被正確釋放
                ambientSource.dispose();
                ambientSource = null;
            }
            currentAmbientType = null;
            updateAmbientUI();
        };

        window.updateVolume = function(val) {
            mainVolume.volume.value = parseFloat(val);
        };

        function updateAmbientUI() {
            document.querySelectorAll('.ambient-toggle').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
            });
            if (currentAmbientType) {
                const types = ['brown', 'drone', 'zen'];
                const idx = types.indexOf(currentAmbientType);
                if (idx !== -1) {
                    document.querySelectorAll('.ambient-toggle')[idx].classList.add('bg-indigo-600', 'text-white');
                }
            }
        }

        window.onload = function() {
            // 初始化 DOM 元素
            timerDisplay = document.getElementById('timerDisplay');
            timerProgress = document.getElementById('timerProgress');
            startBtn = document.getElementById('startBtn');
            resetBtn = document.getElementById('resetBtn');
            taskInput = document.getElementById('taskInput');
            addTaskBtn = document.getElementById('addTaskBtn');
            taskList = document.getElementById('taskList');
            taskStats = document.getElementById('taskStats');

            // 初始化 Lucide 圖標
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }

            // 事件監聽
            startBtn.addEventListener('click', toggleTimer);
            resetBtn.addEventListener('click', () => window.setTimer(25, 'focus'));
            addTaskBtn.addEventListener('click', addTask);
            taskInput.addEventListener('keypress', (e) => e.key === 'Enter' && addTask());

            // 初始渲染
            renderTasks();
            updateDisplay();
        };

        function toggleTimer() {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                startBtn.textContent = '繼續專注';
                startBtn.classList.replace('bg-rose-500', 'bg-indigo-600');
                document.querySelector('.relative.w-64').classList.remove('timer-active');
                updateDisplay();
            } else {
                if (timeLeft <= 0) timeLeft = totalTime;
                
                startBtn.textContent = '暫停計時';
                startBtn.classList.replace('bg-indigo-600', 'bg-rose-500');
                document.querySelector('.relative.w-64').classList.add('timer-active');

                timerId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerId);
                        timerId = null;
                        startBtn.textContent = '開始專注';
                        startBtn.classList.replace('bg-rose-500', 'bg-indigo-600');
                        document.querySelector('.relative.w-64').classList.remove('timer-active');
                        notifyUser();
                        updateDisplay();
                    }
                }, 1000);
            }
        }

        function renderTasks() {
            if (!taskList) return;
            taskList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `group flex items-center justify-between p-4 rounded-2xl border border-slate-100 transition-all ${task.completed ? 'bg-slate-50 opacity-60' : 'bg-white hover:shadow-md'}`;
                li.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <button onclick="toggleTask(${index})" class="w-6 h-6 rounded-full border-2 ${task.completed ? 'bg-green-500 border-green-500' : 'border-slate-300'} flex items-center justify-center transition-colors">
                            ${task.completed ? '<i data-lucide="check" class="w-4 h-4 text-white"></i>' : ''}
                        </button>
                        <span class="${task.completed ? 'line-through text-slate-400' : 'text-slate-700'} font-medium">${task.text}</span>
                    </div>
                    <button onclick="deleteTask(${index})" class="text-slate-300 hover:text-rose-500 transition-colors opacity-0 group-hover:opacity-100">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                `;
                taskList.appendChild(li);
            });
            if (typeof lucide !== 'undefined') lucide.createIcons();
            updateStats();
            localStorage.setItem('zenflow_tasks', JSON.stringify(tasks));
        }

        window.addTask = function() {
            const text = taskInput.value.trim();
            if (text) {
                tasks.push({ text, completed: false });
                taskInput.value = '';
                renderTasks();
            }
        };

        window.toggleTask = function(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        };

        window.deleteTask = function(index) {
            tasks.splice(index, 1);
            renderTasks();
        };

        function updateStats() {
            if (!taskStats) return;
            const completedCount = tasks.filter(t => t.completed).length;
            taskStats.textContent = `${completedCount} / ${tasks.length} 完成`;
        }

        function notifyUser() {
            const modal = document.createElement('div');
            modal.className = "fixed inset-0 flex items-center justify-center z-50 bg-black/50 backdrop-blur-sm";
            modal.innerHTML = `
                <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4 text-center">
                    <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="bell" class="w-8 h-8"></i>
                    </div>
                    <h3 class="text-xl font-bold mb-2">時段結束！</h3>
                    <p class="text-slate-500 mb-6">做得很棒。休息一下或是開始下一個專注時段吧。</p>
                    <button onclick="this.parentElement.parentElement.remove()" class="w-full py-3 bg-indigo-600 text-white rounded-2xl font-bold">確認</button>
                </div>
            `;
            document.body.appendChild(modal);
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }
    </script>
</body>
</html>
